<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>今日訊息 | 00:00 能量卡</title>
<link rel="icon" href="assets/logo-mark.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Noto+Sans+TC:wght@300;400;500;600&display=swap');

  *{ margin:0; padding:0; box-sizing:border-box; }

  html, body{
    width:100%; min-height:100vh;
    color:#f2e8d8;
    font-family:'Noto Sans TC', 'Noto Serif TC', serif;
    -webkit-font-smoothing:antialiased;
  }

  body{
    background:
      linear-gradient(180deg, rgba(10,9,8,0.55) 0%, rgba(10,9,8,0.38) 35%, rgba(10,9,8,0.72) 100%),
      url('assets/bg-water.jpg') center / cover no-repeat fixed;
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:100vh;
    padding: 2rem 1.25rem 4rem;
  }

  header.nav{
    width:100%;
    max-width:640px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom: 1.5rem;
  }
  .brand-mark{ height: 52px; width: auto; display:block; }
  .back-link{
    font-size:0.78rem; letter-spacing:0.1em; color:#e6d9c2;
    text-decoration:none; border-bottom:1px solid rgba(230,217,194,0.5); padding-bottom:2px;
    white-space:nowrap;
  }

  main{
    flex:1;
    width:100%;
    max-width:660px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }

  .eyebrow{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    letter-spacing:0.15em;
    color:#e0b25e;
    font-size:1.3rem;
    margin-bottom:0.6rem;
  }
  h1{
    font-family:'Noto Serif TC', serif;
    font-weight:900;
    font-size:clamp(2.6rem, 11vw, 4rem);
    letter-spacing:0.06em;
    color:#ffffff;
  }
  .sub{
    margin-top:1.6rem;
    font-family:'Noto Serif TC', serif;
    font-weight:700;
    font-size:1.15rem;
    line-height:1.6;
    color:#ffffff;
    letter-spacing:0.03em;
  }

  /* ---- card stage ---- */
  .stage{
    position:relative;
    width: min(88vw, 330px);
    aspect-ratio: 720 / 1202;
    margin: 2.6rem 0 1.6rem;
    perspective: 1400px;
  }
  .stage.landscape{
    width: min(96vw, 640px);
    aspect-ratio: 960 / 574;
  }

  @keyframes shuffleJitterCard{
    0%   { transform: rotate(0deg) translate(0, 0) scale(1); }
    15%  { transform: rotate(13deg) translate(30px, -6px) scale(0.98); }
    30%  { transform: rotate(-16deg) translate(-32px, 8px) scale(0.98); }
    45%  { transform: rotate(15deg) translate(34px, -6px) scale(0.98); }
    60%  { transform: rotate(-12deg) translate(-26px, 6px) scale(0.98); }
    75%  { transform: rotate(8deg) translate(14px, -3px) scale(0.99); }
    90%  { transform: rotate(-3deg) translate(-4px, 2px) scale(1); }
    100% { transform: rotate(0deg) translate(0, 0) scale(1); }
  }
  .stage.shuffling .card{ animation: shuffleJitterCard 1.1s ease-in-out; }

  .card{
    position:absolute;
    inset:0;
    border-radius:16px;
    overflow:hidden;
    cursor:default;
    border:1px solid rgba(242,232,216,0.25);
    box-shadow: 0 16px 40px rgba(0,0,0,0.45);
    display:flex;
    align-items:center;
    justify-content:center;
    transition: transform .28s ease;
    transform-style: preserve-3d;
  }
  .card.can-tap{ cursor:pointer; }
  .card.flipping{ transition: transform .26s cubic-bezier(.4,0,.2,1); }

  /* ---- facedown card design ---- */
  .facedown{
    position:absolute;
    inset:0;
    background:#2e323d;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .fd-frame-outer{
    position:absolute; inset:7%;
    border:1.5px solid rgba(242,232,216,0.85);
    border-radius:14px;
  }
  .fd-frame-inner{
    position:absolute; inset:12% 10%;
    border:1.5px solid rgba(242,232,216,0.85);
    border-radius:50% / 16%;
  }
  .fd-circle{
    position:absolute;
    width:20px; height:20px;
    border:1.5px solid rgba(242,232,216,0.85);
    border-radius:50%;
  }
  .fd-circle.tl{ top:9.5%; left:8%; }
  .fd-circle.tr{ top:9.5%; right:8%; }
  .fd-circle.bl{ bottom:9.5%; left:8%; }
  .fd-circle.br{ bottom:9.5%; right:8%; }
  .fd-dot{
    position:absolute;
    width:6px; height:6px;
    border-radius:50%;
    background:rgba(242,232,216,0.85);
  }
  .fd-dot.tl{ top:8%; left:8.6%; }
  .fd-dot.tr{ top:8%; right:8.6%; }
  .fd-dot.bl{ bottom:8%; left:8.6%; }
  .fd-dot.br{ bottom:8%; right:8.6%; }
  .facedown .fd-mark-img{
    position:relative;
    z-index:2;
    width:56%;
    height:auto;
    object-fit:contain;
  }

  .card-face{
    position:absolute;
    inset:0;
    width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
  }
  .card-face img{
    width:100%; height:100%; object-fit:cover; display:block;
  }

  .hint{
    margin-top:0.2rem;
    min-height:1.4em;
    font-size:0.82rem;
    letter-spacing:0.06em;
    color:#d8c3a0;
    opacity:0;
    transition: opacity .4s ease;
  }
  .hint.show{ opacity:1; }

  .cta-btn{
    margin-top:1.6rem;
    display:inline-block;
    background:#f2e8d8;
    color:#3c2c1f;
    border:none;
    padding:1rem 3rem;
    font-size:0.9rem;
    letter-spacing:0.2em;
    font-family:inherit;
    cursor:pointer;
    transition: transform .3s ease, box-shadow .3s ease, opacity .3s ease;
    box-shadow: 0 4px 30px rgba(0,0,0,0.25);
  }
  .cta-btn:hover{ transform: translateY(-2px); box-shadow: 0 8px 40px rgba(0,0,0,0.35); }
  .cta-btn:active{ transform: translateY(0); }
  .cta-btn.ghost{
    background:transparent;
    color:#f2e8d8;
    border:1px solid rgba(242,232,216,0.5);
    box-shadow:none;
  }
  .cta-btn[hidden]{ display:none; }

  .actions{
    margin-top:1.6rem;
    display:flex;
    gap:0.9rem;
    flex-wrap:wrap;
    justify-content:center;
  }

</style>
</head>
<body>

<header class="nav">
  <img src="assets/header-logo.png" alt="00:00 A New Day" class="brand-mark">
  <a href="index.html" class="back-link">← 回首頁</a>
</header>

<main>
  <div class="eyebrow">Today's Message</div>
  <h1 id="titleText">今日訊息</h1>

  <div class="stage" id="stage">
    <div class="card can-tap" id="card">
      <div class="card-face" id="cardFace"></div>
    </div>
  </div>

  <p class="sub" id="subText">靜下心，點擊卡片<br>抽一張屬於你的訊息</p>
  <p class="hint" id="hint"></p>

  <div class="actions">
    <button class="cta-btn ghost" id="againBtn" type="button" hidden>再抽一張</button>
  </div>
</main>

<script>
  const TOTAL_CARDS = 10;
  const stage = document.getElementById('stage');
  const card = document.getElementById('card');
  const cardFace = document.getElementById('cardFace');
  const againBtn = document.getElementById('againBtn');
  const hint = document.getElementById('hint');
  const titleText = document.getElementById('titleText');
  const subText = document.getElementById('subText');

  const FACEDOWN_HTML = `
    <div class="facedown">
      <div class="fd-frame-outer"></div>
      <div class="fd-frame-inner"></div>
      <div class="fd-circle tl"></div>
      <div class="fd-circle tr"></div>
      <div class="fd-circle bl"></div>
      <div class="fd-circle br"></div>
      <div class="fd-dot tl"></div>
      <div class="fd-dot tr"></div>
      <div class="fd-dot bl"></div>
      <div class="fd-dot br"></div>
      <img class="fd-mark-img" src="assets/card-back-mark.png" alt="00:00 A New Day">
    </div>`;

  let state = 'idle'; // idle -> revealing -> front -> back
  let lastDrawn = null;

  const loadedImages = new Set();
  function preloadImage(src){
    return new Promise(resolve => {
      if (loadedImages.has(src)){ resolve(); return; }
      const img = new Image();
      img.onload = () => { loadedImages.add(src); resolve(); };
      img.onerror = () => resolve();
      img.src = src;
    });
  }

  for (let n = 1; n <= TOTAL_CARDS; n++){
    const nn = String(n).padStart(2, '0');
    preloadImage(`assets/cards/card-${nn}-front.jpg`);
    preloadImage(`assets/cards/card-${nn}-back.jpg`);
  }

  function pickCard(){
    let n;
    do { n = 1 + Math.floor(Math.random() * TOTAL_CARDS); }
    while (TOTAL_CARDS > 1 && n === lastDrawn);
    lastDrawn = n;
    return n;
  }

  function flipCardTo(renderFn, { instant } = {}){
    return new Promise(resolve => {
      if (instant){
        Promise.resolve(renderFn()).then(resolve);
        return;
      }
      card.classList.add('flipping');
      card.style.transform = 'rotateY(90deg) scale(0.96)';
      setTimeout(() => {
        Promise.resolve(renderFn()).then(() => {
          card.style.transform = 'rotateY(0deg) scale(1)';
          setTimeout(resolve, 260);
        });
      }, 260);
    });
  }

  function renderFacedown(){
    cardFace.innerHTML = FACEDOWN_HTML;
  }

  async function renderFront(n){
    const src = `assets/cards/card-${String(n).padStart(2,'0')}-front.jpg`;
    await preloadImage(src);
    cardFace.innerHTML = `<img src="${src}" alt="00:00 能量卡 第${n}張 正面">`;
  }

  async function renderBack(n){
    const src = `assets/cards/card-${String(n).padStart(2,'0')}-back.jpg`;
    await preloadImage(src);
    cardFace.innerHTML = `<img src="${src}" alt="00:00 能量卡 第${n}張 今日訊息">`;
  }

  async function startDraw(){
    if (state !== 'idle') return;
    state = 'drawing';
    card.classList.remove('can-tap');
    hint.classList.remove('show');
    subText.textContent = '洗牌中…靜心感受此刻';

    stage.classList.add('shuffling');
    await new Promise(r => setTimeout(r, 900));
    stage.classList.remove('shuffling');

    const n = pickCard();
    await flipCardTo(() => renderFront(n));

    state = 'front';
    card.classList.add('can-tap');
    titleText.textContent = '今日訊息';
    subText.textContent = '輕觸卡片，翻開此刻需要的訊息與儀式';
    hint.classList.remove('show');
    againBtn.hidden = true;

    card.dataset.drawn = n;
  }

  async function revealBack(){
    if (state !== 'front') return;
    state = 'back';
    hint.classList.remove('show');
    const n = parseInt(card.dataset.drawn, 10);
    await flipCardTo(() => { stage.classList.add('landscape'); renderBack(n); });

    subText.textContent = '願這份訊息，陪你度過此刻。';
    hint.textContent = '輕觸卡片，翻回正面';
    hint.classList.add('show');
    againBtn.hidden = false;
  }

  async function revealFront(){
    if (state !== 'back') return;
    state = 'front';
    hint.classList.remove('show');
    const n = parseInt(card.dataset.drawn, 10);
    await flipCardTo(() => { stage.classList.remove('landscape'); renderFront(n); });

    subText.textContent = '輕觸卡片，翻開此刻需要的訊息與儀式';
    hint.classList.remove('show');
  }

  function resetDeck(){
    state = 'idle';
    flipCardTo(() => { stage.classList.remove('landscape'); renderFacedown(); });
    card.classList.add('can-tap');
    titleText.textContent = '今日訊息';
    subText.innerHTML = '靜下心，點擊卡片<br>抽一張屬於你的訊息';
    hint.classList.remove('show');
    againBtn.hidden = true;
  }

  againBtn.addEventListener('click', resetDeck);
  card.addEventListener('click', () => {
    if (state === 'idle') startDraw();
    else if (state === 'front') revealBack();
    else if (state === 'back') revealFront();
  });

  renderFacedown();
</script>

</body>
</html>
